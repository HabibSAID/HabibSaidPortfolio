<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">

  <meta
    http-equiv="Content-Type"
    content="text/html; charset=utf-8"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Unity WebGL Player | HabibSaid-Portfolio</title>

  <link
    rel="shortcut icon"
    href="TemplateData/favicon.ico"
  >

  <link
    rel="stylesheet"
    href="TemplateData/style.css"
  >
</head>

<body>

  <div id="unity-container">

    <canvas
      id="unity-canvas"
      width="1920"
      height="1080"
      tabindex="-1"
    ></canvas>

    <div id="unity-loading-bar">

      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>

    </div>

    <div id="unity-warning"></div>

  </div>


  <script>

    /*
    ============================================================
    IMPORTANT
    ============================================================

    Change this value every time you upload a new Unity build.

    Example:
    20260825_1
    20260825_2
    20260826_1

    This prevents browsers and Vercel from reusing an older
    Unity loader/build file.
    */

    const BUILD_VERSION = "20260825_1";


    /*
    ============================================================
    UNITY ELEMENTS
    ============================================================
    */

    const container =
      document.querySelector("#unity-container");

    const canvas =
      document.querySelector("#unity-canvas");

    const loadingBar =
      document.querySelector("#unity-loading-bar");

    const progressBarFull =
      document.querySelector("#unity-progress-bar-full");

    const warningBanner =
      document.querySelector("#unity-warning");


    /*
    ============================================================
    UNITY WARNING / ERROR BANNER
    ============================================================
    */

    function unityShowBanner(message, type) {

      function updateBannerVisibility() {

        warningBanner.style.display =
          warningBanner.children.length
            ? "block"
            : "none";
      }


      const div =
        document.createElement("div");

      div.innerHTML = message;

      warningBanner.appendChild(div);


      if (type === "error") {

        div.style =
          "background: red; color: white; padding: 10px;";

      } else {

        if (type === "warning") {

          div.style =
            "background: yellow; color: black; padding: 10px;";
        }


        setTimeout(() => {

          if (div.parentNode) {
            warningBanner.removeChild(div);
          }

          updateBannerVisibility();

        }, 5000);
      }


      updateBannerVisibility();
    }


    /*
    ============================================================
    UNITY BUILD PATHS
    ============================================================

    YOUR FILES:

    Build/
      Builds.data
      Builds.framework.js
      Builds.loader.js
      Builds.wasm
      Builds.jpg

    NO .br
    NO .gz

    ============================================================
    */

    const buildUrl = "Build";


    const loaderUrl =
      `${buildUrl}/Builds.loader.js?v=${BUILD_VERSION}`;


    const config = {

      dataUrl:
        `${buildUrl}/Builds.data?v=${BUILD_VERSION}`,

      frameworkUrl:
        `${buildUrl}/Builds.framework.js?v=${BUILD_VERSION}`,

      codeUrl:
        `${buildUrl}/Builds.wasm?v=${BUILD_VERSION}`,

      streamingAssetsUrl:
        "StreamingAssets",

      companyName:
        "HS",

      productName:
        "HabibSaid-Portfolio",

      productVersion:
        "1",

      showBanner:
        unityShowBanner
    };


    /*
    ============================================================
    MOBILE SETTINGS
    ============================================================
    */

    if (
      /iPhone|iPad|iPod|Android/i.test(
        navigator.userAgent
      )
    ) {

      container.className =
        "unity-mobile";

      canvas.className =
        "unity-mobile";
    }


    /*
    ============================================================
    BACKGROUND IMAGE
    ============================================================
    */

    canvas.style.background =
      `url('${buildUrl}/Builds.jpg?v=${BUILD_VERSION}')
       center / cover`;


    /*
    ============================================================
    SHOW LOADING BAR
    ============================================================
    */

    loadingBar.style.display =
      "block";


    /*
    ============================================================
    DEBUG INFORMATION
    ============================================================
    */

    console.log(
      "Unity Build Version:",
      BUILD_VERSION
    );

    console.log(
      "Unity Loader:",
      loaderUrl
    );

    console.log(
      "Unity Data:",
      config.dataUrl
    );

    console.log(
      "Unity Framework:",
      config.frameworkUrl
    );

    console.log(
      "Unity WASM:",
      config.codeUrl
    );


    /*
    ============================================================
    LOAD UNITY LOADER
    ============================================================
    */

    const script =
      document.createElement("script");


    script.src =
      loaderUrl;


    script.onload = () => {

      console.log(
        "Unity loader loaded successfully."
      );


      if (
        typeof createUnityInstance !==
        "function"
      ) {

        const error =
          "createUnityInstance() was not found. " +
          "The Unity loader may be incorrect or cached.";

        console.error(error);

        unityShowBanner(
          error,
          "error"
        );

        return;
      }


      createUnityInstance(

        canvas,

        config,

        (progress) => {

          progressBarFull.style.width =
            `${100 * progress}%`;
        }

      )

      .then((unityInstance) => {

        console.log(
          "Unity instance started successfully."
        );

        loadingBar.style.display =
          "none";


        /*
        Optional global reference.

        Useful if JavaScript outside this script
        needs to communicate with Unity later.
        */

        window.unityInstance =
          unityInstance;

      })

      .catch((message) => {

        console.error(
          "Unity failed to start:",
          message
        );

        unityShowBanner(
          message,
          "error"
        );

      });
    };


    /*
    ============================================================
    LOADER ERROR
    ============================================================
    */

    script.onerror = () => {

      const error =
        "Failed to load Unity loader: " +
        loaderUrl;

      console.error(error);

      unityShowBanner(
        error,
        "error"
      );
    };


    /*
    ============================================================
    START LOADING
    ============================================================
    */

    document.body.appendChild(script);

  </script>

</body>

</html>
