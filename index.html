<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Unity WebGL Player | HabibSaid-Portfolio</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
  </div>

  <script>
    // Change this every time you upload a new Unity build.
    const BUILD_VERSION = "20260825_2";

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(message, type) {
      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length ? "block" : "none";
      }

      const div = document.createElement("div");
      div.innerHTML = message;
      warningBanner.appendChild(div);

      if (type === "error") {
        div.style = "background:red;color:white;padding:10px;";
      } else {
        if (type === "warning") {
          div.style = "background:yellow;color:black;padding:10px;";
        }

        setTimeout(() => {
          if (div.parentNode) {
            warningBanner.removeChild(div);
          }
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

    const buildUrl = "Build";

    const loaderUrl =
      `${buildUrl}/Builds.loader.js?v=${BUILD_VERSION}`;

    const config = {
      dataUrl:
        `${buildUrl}/Builds.data?v=${BUILD_VERSION}`,

      frameworkUrl:
        `${buildUrl}/Builds.framework.js?v=${BUILD_VERSION}`,

      codeUrl:
        `${buildUrl}/Builds.wasm?v=${BUILD_VERSION}`,

      streamingAssetsUrl:
        "StreamingAssets",

      companyName:
        "HS",

      productName:
        "HabibSaid-Portfolio",

      // Important: use a different product version for every deployed build.
      productVersion:
        BUILD_VERSION,

      // Temporarily disable Unity's IndexedDB/Cache API build caching.
      // This avoids an old Builds.data being mixed with a new WASM/framework.
      cacheControl: function (url) {
        return "no-store";
      },

      showBanner:
        unityShowBanner
    };

    // Makes the live runtime config easy to inspect from DevTools.
    window.UNITY_CONFIG_DEBUG = config;

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      canvas.className = "unity-mobile";
    }

    canvas.style.background =
      `url('${buildUrl}/Builds.jpg?v=${BUILD_VERSION}') center / cover`;

    loadingBar.style.display = "block";

    console.log("Unity Build Version:", BUILD_VERSION);
    console.log("Unity Loader:", loaderUrl);
    console.log("Unity Data:", config.dataUrl);
    console.log("Unity Framework:", config.frameworkUrl);
    console.log("Unity WASM:", config.codeUrl);

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      console.log("Unity loader loaded successfully.");

      if (typeof createUnityInstance !== "function") {
        const error =
          "createUnityInstance() was not found. The Unity loader may be incorrect or cached.";

        console.error(error);
        unityShowBanner(error, "error");
        return;
      }

      createUnityInstance(
        canvas,
        config,
        (progress) => {
          const percentage = Math.round(progress * 100);
          console.log("Unity loading:", percentage + "%");
          progressBarFull.style.width = percentage + "%";
        }
      )
      .then((unityInstance) => {
        console.log("Unity instance created.");
        loadingBar.style.display = "none";
        window.unityInstance = unityInstance;
      })
      .catch((error) => {
        console.error("UNITY STARTUP FAILED:", error);
        unityShowBanner(
          "Unity startup failed. Open browser DevTools Console for details.<br>" + error,
          "error"
        );
      });
    };

    script.onerror = () => {
      const error = "Failed to load Unity loader: " + loaderUrl;
      console.error(error);
      unityShowBanner(error, "error");
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
